# Nightly for 24×100 (02:00 ET): refresh the public data, rebuild what the site reads from it, re-check every City lot
# (tonight's shortlist), then the watchlist digest.
#   1. refresh    re-pull the public datasets and record what changed (data/refresh/latest.json, shown in pencil)
#   2. build      rebuild the city file, summary, what-ifs and API from the refreshed pull (npm run build:data), so the
#                 shortlist reads tonight's inventory, not last week's
#   3. shortlist  the due-diligence agent over all City-owned vacant lots (agents/shortlist.py): WPRDC in PIN batches
#                 with field whitelists (never an owner's name), no model, about 100 requests; data/shortlist/
#   4. commit     everything the site reads (city, blocks, money, refresh, shortlist), so it shows tonight's run
#   4. digest     Slack and/or email, ONLY when a channel's secret is set (SLACK_WEBHOOK_URL; RESEND_API_KEY and
#                 DIGEST_TO, DIGEST_FROM optional; SMTP_* as a fallback); it reports watched lots that changed and the
#                 lots new on the shortlist. Secrets are never printed. It never sends anything to the City.
# A failed refresh doesn't stop the shortlist (the step shows as failed in the run; the build then keeps the committed
# city file). Not yet run on GitHub: after the repository is public, run it once by hand (workflow_dispatch).
name: nightly
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # 02:00 ET (06:00 UTC)
permissions:
  contents: write
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci && uv sync
      - name: Refresh the public data (record what changed)
        continue-on-error: true
        run: uv run python -m pipeline refresh
      - name: Rebuild what the site reads (city file, summary, what-ifs, API)
        run: npm run build:data
      - name: Tonight's shortlist (every City lot re-checked; no model)
        run: npm run shortlist
      - name: Commit tonight's run
        run: |
          git config user.name "24x100 nightly"
          git config user.email "nightly@users.noreply.github.com"
          git add data/shortlist data/city/lots.json data/city/summary.json data/city/scenarios.json data/blocks data/money
          if [ -f data/refresh/latest.json ]; then git add data/refresh/latest.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Nightly: the data refresh, the rebuilt city data and tonight's shortlist"
            git push
          fi
      - name: Is a digest channel set?
        id: gate
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ] && [ -z "$RESEND_API_KEY" ] && [ -z "$SMTP_HOST" ]; then
            echo "No SLACK_WEBHOOK_URL, RESEND_API_KEY or SMTP_HOST secret: the digest is off. Nothing sent."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and send the digest (only if something changed)
        if: steps.gate.outputs.on == 'true'
        run: npx tsx scripts/digest.ts --send
      - name: Record the state sent
        if: steps.gate.outputs.on == 'true'
        run: |
          if [ -n "$(git status --porcelain data/digest/last.json)" ]; then
            git add data/digest/last.json
            git commit -m "Digest sent: record the state"
            git push
          fi
