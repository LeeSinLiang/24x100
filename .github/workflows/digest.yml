# Nightly watchlist digest for 24×100: when a watched lot's records, rules or map verdict change on main (a merged
# data refresh, published reviews), it posts to Slack and/or sends an email, then commits the state it sent
# (data/digest/last.json) so each change pings once. OFF until a channel is set: with no SLACK_WEBHOOK_URL, no
# RESEND_API_KEY and no SMTP_HOST secret it stops after the first step and sends nothing. Secrets (Settings → Secrets
# and variables → Actions): SLACK_WEBHOOK_URL; RESEND_API_KEY, DIGEST_TO and optionally DIGEST_FROM for email through
# Resend (its test sender delivers only to the account owner's address); SMTP_* only as a fallback. They are never
# printed. It never sends anything to the City.
name: watchlist-digest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 08:00 ET
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Off until a channel is set
        id: gate
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ] && [ -z "$RESEND_API_KEY" ] && [ -z "$SMTP_HOST" ]; then
            echo "No SLACK_WEBHOOK_URL, RESEND_API_KEY or SMTP_HOST secret: the digest is off. Nothing sent."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.on == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.on == 'true'
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.on == 'true'
      - if: steps.gate.outputs.on == 'true'
        run: npm ci && uv sync
      - name: Build and send the digest (only if something changed)
        if: steps.gate.outputs.on == 'true'
        run: npx tsx scripts/digest.ts --send
      - name: Record the state sent
        if: steps.gate.outputs.on == 'true'
        run: |
          if [ -n "$(git status --porcelain data/digest/last.json)" ]; then
            git config user.name "24x100 digest"
            git config user.email "digest@users.noreply.github.com"
            git add data/digest/last.json
            git commit -m "Digest sent: record the state"
            git push
          fi
