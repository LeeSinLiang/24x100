[project]
name = "lot24x100"
version = "0.1.0"
description = "24x100: data pipeline and rule extraction for Pittsburgh lot feasibility"
requires-python = ">=3.11,<3.14"
dependencies = [
  "requests>=2.32",
  "shapely>=2.0",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-anthropic>=0.3",
  "langgraph>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "extract/tests", "agents/tests"]
